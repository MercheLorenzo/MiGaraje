name: MiGaraje CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - vehicles-service
          - maintenance-service
          - maintenance-planning-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -v

  lint-dockerfiles:
    name: Hadolint - ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - frontend/Dockerfile
          - services/vehicles-service/Dockerfile
          - services/maintenance-service/Dockerfile
          - services/maintenance-planning-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
  
  build-images:
    name: Build Docker image - ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vehicles-service
            context: ./services/vehicles-service
          - name: maintenance-service
            context: ./services/maintenance-service
          - name: maintenance-planning-service
            context: ./services/maintenance-planning-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            -t migaraje-${{ matrix.image.name }}:ci \
            ${{ matrix.image.context }}