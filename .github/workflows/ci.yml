name: MiGaraje CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - vehicles-service
          - maintenance-service
          - maintenance-planning-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -v

  lint-dockerfiles:
    name: Hadolint - ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - frontend/Dockerfile
          - services/vehicles-service/Dockerfile
          - services/maintenance-service/Dockerfile
          - services/maintenance-planning-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
  
  build-images:
    name: Build Docker image - ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vehicles-service
            context: ./services/vehicles-service
          - name: maintenance-service
            context: ./services/maintenance-service
          - name: maintenance-planning-service
            context: ./services/maintenance-planning-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            -t migaraje-${{ matrix.image.name }}:ci \
            ${{ matrix.image.context }}
  
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=migaraje
          POSTGRES_USER=migaraje
          POSTGRES_PASSWORD=ci_test_password
          DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje
          VEHICLES_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_vehicles
          MAINTENANCE_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_maintenance
          PLANNING_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_planning
          VEHICLES_SERVICE_URL=http://vehicles-service:8000
          PLANNING_SERVICE_URL=http://maintenance-planning-service:8002
          EOF

      - name: Start services and wait for health checks
        run: |
          docker compose up -d --build --wait --wait-timeout 180 \
            vehicles-service \
            maintenance-service \
            maintenance-planning-service

      #- name: Install integration test dependencies
        #run: |
          #python -m pip install --upgrade pip
          #pip install requests

      - name: Run integration tests
        run: python scripts/integration_tests.py

      - name: Show service logs if integration tests fail
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
  
  publish-images:
    name: Publish Docker image - ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    needs:
      - test
      - lint-dockerfiles
      - build-images
      - integration-tests

    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vehicles-service
            context: ./services/vehicles-service
          - name: maintenance-service
            context: ./services/maintenance-service
          - name: maintenance-planning-service
            context: ./services/maintenance-planning-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          target: production
          push: true
          tags: ghcr.io/merchelorenzo/migaraje-${{ matrix.image.name }}:sha-${{ github.sha }}