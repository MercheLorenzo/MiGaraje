name: MiGaraje CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - vehicles-service
          - maintenance-service
          - maintenance-planning-service
          - gateway-service
          - statistics-service
          - notifications-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint checks (informational)
        run: ruff check .
        continue-on-error: true

      - name: Check Python formatting (informational)
        run: ruff format --check .
        continue-on-error: true

      - name: Run tests
        run: python -m pytest -v

  lint-dockerfiles:
    name: Hadolint - ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - frontend/Dockerfile
          - services/vehicles-service/Dockerfile
          - services/maintenance-service/Dockerfile
          - services/maintenance-planning-service/Dockerfile
          - services/gateway-service/Dockerfile
          - services/statistics-service/Dockerfile
          - services/notifications-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
  
  build-images:
    name: Build Docker image - ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vehicles-service
            context: ./services/vehicles-service
          - name: maintenance-service
            context: ./services/maintenance-service
          - name: maintenance-planning-service
            context: ./services/maintenance-planning-service
          - name: gateway-service
            context: ./services/gateway-service
          - name: statistics-service
            context: ./services/statistics-service
          - name: notifications-service
            context: ./services/notifications-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            -t migaraje-${{ matrix.image.name }}:ci \
            ${{ matrix.image.context }}
  
  frontend-checks:
    name: Frontend JavaScript and resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/theme.js
          node scripts/test_frontend_task_state.cjs
      - name: Verify static resources and Swagger examples
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          html = Path('frontend/index.html').read_text(encoding='utf-8')
          for resource in ('MiGaraje.png', 'css/style.css', 'js/app.js', 'js/theme.js'):
              assert resource in html, resource
              assert (Path('frontend') / resource).is_file(), resource
          print('HTML references: OK')
          PYCODE

  integration-tests:
    name: End-to-end HTTP (PostgreSQL + all services)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure disposable test database and service secrets
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=migaraje
          POSTGRES_USER=migaraje
          POSTGRES_PASSWORD=ci_test_password
          DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje
          VEHICLES_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_vehicles
          MAINTENANCE_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_maintenance
          PLANNING_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_planning
          VEHICLES_SERVICE_URL=http://vehicles-service:8000
          PLANNING_SERVICE_URL=http://maintenance-planning-service:8002
          GATEWAY_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_gateway
          NOTIFICATIONS_DATABASE_URL=postgresql+psycopg://migaraje:ci_test_password@db:5432/migaraje_notifications
          JWT_SECRET=ci_only_jwt_secret_change_in_real_deployments_123456
          INTERNAL_API_KEY=ci_only_internal_secret_not_for_real_installations_789
          NOTIFICATION_INTERVAL_SECONDS=3600
          EOF
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Start the complete app and wait for health checks
        run: |
          docker compose up -d --build --wait --wait-timeout 300 frontend-production
          docker compose ps -a
      - name: Test original microservice integration
        env:
          INTERNAL_API_KEY: ci_only_internal_secret_not_for_real_installations_789
        run: python scripts/integration_tests.py
      - name: Test Gateway, frontend, JWT, CRUD, km, statistics and notifications
        env:
          MIGARAJE_E2E_ALLOW_WRITES: "1"
        run: python scripts/e2e_gateway.py
      - name: Show service logs if integration tests fail
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 150
      - name: Stop services and remove test volumes
        if: always()
        run: docker compose down -v --remove-orphans

  publish-images:
    name: Publish Docker image - ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    needs:
      - test
      - lint-dockerfiles
      - build-images
      - integration-tests
      - frontend-checks

    # Never publish images from a feature branch or an unmerged PR.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vehicles-service
            context: ./services/vehicles-service
          - name: maintenance-service
            context: ./services/maintenance-service
          - name: maintenance-planning-service
            context: ./services/maintenance-planning-service
          - name: gateway-service
            context: ./services/gateway-service
          - name: statistics-service
            context: ./services/statistics-service
          - name: notifications-service
            context: ./services/notifications-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          target: production
          push: true
          tags: ghcr.io/merchelorenzo/migaraje-${{ matrix.image.name }}:sha-${{ github.sha }}