[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # Errores de estilo
    "F",      # Errores y variables/imports sin usar
    "I",      # Organización de imports
    "UP",     # Mejoras de sintaxis Python
    "B",      # Bugbear: posibles errores
    "BLE",    # Excepciones demasiado genéricas
    "PLW",    # Advertencias de Pylint
]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]
"alembic/env.py" = ["F401"]
"app/main.py" = ["F401"]