services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: migaraje-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    restart: unless-stopped
    networks:
      - migaraje-network

  frontend-production:
    build:
      context: ./frontend
      target: production
    container_name: migaraje-frontend-production
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - migaraje-network

  vehicles-service:
    build:
      context: ./services/vehicles-service
    container_name: migaraje-vehicles-service
    environment:
      APP_NAME: "MiGaraje Vehicles Service"
      DATABASE_URL: ${VEHICLES_DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - migaraje-network
  
  maintenance-service:
    build:
      context: ./services/maintenance-service
    container_name: migaraje-maintenance-service
    environment:
      APP_NAME: "MiGaraje Maintenance Service"
      DATABASE_URL: ${MAINTENANCE_DATABASE_URL}
      VEHICLES_SERVICE_URL: ${VEHICLES_SERVICE_URL}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      vehicles-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - migaraje-network
  
  maintenance-planning-service:
    build:
      context: ./services/maintenance-planning-service
    container_name: migaraje-maintenance-planning-service
    environment:
      APP_NAME: "MiGaraje Maintenance Planning Service"
      DATABASE_URL: ${PLANNING_DATABASE_URL}
      VEHICLES_SERVICE_URL: ${VEHICLES_SERVICE_URL}
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      vehicles-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - migaraje-network

  db:
    image: postgres:17
    container_name: migaraje-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - migaraje-network

volumes:
  postgres_data:

networks:
  migaraje-network:
    driver: bridge