services:
  vehicles-service:
    build:
      context: ./services/vehicles-service
    container_name: migaraje-vehicles-service
    environment:
      APP_NAME: "MiGaraje Vehicles Service"
      DATABASE_URL: ${VEHICLES_DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  
  maintenance-service:
    build:
      context: ./services/maintenance-service
    container_name: migaraje-maintenance-service
    environment:
      APP_NAME: "MiGaraje Maintenance Service"
      DATABASE_URL: ${MAINTENANCE_DATABASE_URL}
      VEHICLES_SERVICE_URL: ${VEHICLES_SERVICE_URL}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      vehicles-service:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: migaraje-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
